services:
  - type: web
    name: callivo
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install && npm run build && cd server && npm install && npm run prisma:generate && npm run build
    startCommand: cd server && npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: callivo-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: STUN_SERVER_URL
        value: stun:stun.l.google.com:19302

databases:
  - name: callivo-db
    plan: starter
    databaseName: callivo
    user: callivo
