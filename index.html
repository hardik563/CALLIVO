<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <!-- Primary Browser Branding -->

    <meta name="apple-mobile-web-app-title" content="CALLIVO" />
    
    <!-- Theme & Status Bar Colors -->
    <meta name="theme-color" content="#0B0D10" />
    <meta name="msapplication-TileColor" content="#0B0D10" />

    <link rel="alternate icon" type="image/x-icon" href="/favicon.ico" />

    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CALLIVO" />
    <meta property="og:url" content="https://callivo.com/" />
    <meta property="og:title" content="CALLIVO — Meet. Connect. Collaborate." />
    <meta property="og:description" content="Beautiful, reliable video meetings for modern teams. Ultra-low latency, real-time audio visualizers, and signature 3D spatial conference rooms." />

    <meta name="twitter:image" content="/og-image.png" />
    <meta name="twitter:image:alt" content="CALLIVO — Meet. Connect. Collaborate." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <body class="bg-background text-slate-900 dark:text-slate-100 antialiased selection:bg-brand-500/30 selection:text-brand-200 overflow-x-hidden">
